apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: secretrotations.secretops.io
spec:
  group: secretops.io
  names:
    kind: SecretRotation
    listKind: SecretRotationList
    plural: secretrotations
    singular: secretrotation
    shortNames:
      - sr
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Secret
          type: string
          jsonPath: .spec.secretRef.name
        - name: Schedule
          type: string
          jsonPath: .spec.rotationSchedule
        - name: Last Rotated
          type: date
          jsonPath: .status.lastRotation
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                secretRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                rotationSchedule:
                  type: string
                rotationStrategy:
                  type: string
                  enum: [generate, external]
                keyLength:
                  type: integer
                  default: 32
            status:
              type: object
              properties:
                lastRotation:
                  type: string
                  format: date-time
                nextRotation:
                  type: string
                  format: date-time
                rotationCount:
                  type: integer
                phase:
                  type: string
                message:
                  type: string
